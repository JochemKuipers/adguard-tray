name: Release

on:
  schedule:
    # 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build the version in debian/changelog even if it already matches upstream'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      deb_version: ${{ steps.decide.outputs.deb_version }}
      updated: ${{ steps.decide.outputs.updated }}
    steps:
      - uses: actions/checkout@v4

      - name: Install check tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev devscripts curl ca-certificates python3

      - name: Decide whether to build
        id: decide
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            CHG="$(dpkg-parsechangelog -S Version)"
            UPSTREAM="${CHG%-*}"
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "${TAG}" != "${UPSTREAM}" ]]; then
              echo "Tag v${TAG} does not match debian/changelog ${CHG}" >&2
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "version=${UPSTREAM}" >> "$GITHUB_OUTPUT"
            echo "deb_version=${CHG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ./packaging/sync-upstream.sh --ci

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force }}" == "true" ]]; then
            CHG="$(dpkg-parsechangelog -S Version)"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=${CHG%-*}" >> "$GITHUB_OUTPUT"
            echo "deb_version=${CHG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload bumped changelog
        if: steps.decide.outputs.updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debian-changelog
          path: debian/changelog

  package:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply bumped changelog
        if: needs.check.outputs.updated == 'true'
        uses: actions/download-artifact@v4
        with:
          name: debian-changelog
          path: debian

      - name: Install Debian tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3 dpkg-dev lintian \
            apt-utils gnupg fakeroot curl ca-certificates \
            python3-pyqt6 libgl1 libegl1

      - name: Version from changelog
        id: version
        run: |
          CHG="$(dpkg-parsechangelog -S Version)"
          echo "version=${CHG%-*}" >> "$GITHUB_OUTPUT"
          echo "deb_version=${CHG}" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream and build .deb
        run: ./packaging/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Import check
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}/upstream/adguard-tray-${{ steps.version.outputs.version }}
        run: |
          python3 -c "
          from adguard_tray.cli import AdGuardCLI
          from adguard_tray.config import Config, load_config
          from adguard_tray.i18n import _t
          from adguard_tray.icons import icon_active, icon_inactive, icon_error, icon_unknown
          from adguard_tray.notifications import notify
          from adguard_tray.worker import StatusWorker
          from adguard_tray.manager_window import ManagerWindow
          from adguard_tray.overview_tab import OverviewTab
          print('All imports OK')
          "

      - name: lintian
        run: |
          # Ubuntu's lintian rejects Debian suite names in .changes; this is
          # a third-party repo, so check the .deb only.
          lintian --fail-on error dist/adguard-tray_*_all.deb

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "${APT_GPG_PRIVATE_KEY}" || {
            echo "APT_GPG_PRIVATE_KEY secret is not set" >&2
            exit 1
          }
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s\n' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          test -n "${KEY_ID}"
          echo "GPG_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"

      - name: Fetch existing APT repo
        continue-on-error: true
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://github.com/${{ github.repository }}.git" apt-repo
          rm -rf apt-repo/.git

      - name: Publish APT repo
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          mkdir -p apt-repo
          touch apt-repo/.nojekyll
          ./packaging/publish-apt-repo.sh "$(pwd)/apt-repo" dist/adguard-tray_*_all.deb

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          force_orphan: false
          enable_jekyll: false

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/adguard-tray_*_all.deb

      - name: Commit changelog and tag
        if: needs.check.outputs.updated == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debian/changelog
          git commit -m "chore: package upstream ${{ needs.check.outputs.version }}"
          git tag "v${{ needs.check.outputs.version }}"
          git push origin HEAD "v${{ needs.check.outputs.version }}"

  release:
    needs: [check, package]
    if: |
      always() &&
      needs.package.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.check.outputs.updated == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: adguard-tray ${{ needs.check.outputs.deb_version }} (upstream ${{ needs.check.outputs.version }})
          body: |
            Unofficial Debian package of [RiDDiX/adguard-tray ${{ needs.check.outputs.version }}](https://github.com/RiDDiX/adguard-tray/releases/tag/v${{ needs.check.outputs.version }}).

            ## Installation

            ```
            curl -fsSL https://jochemkuipers.github.io/adguard-tray/install.sh | sudo bash
            ```

            ## Update

            ```
            sudo apt update && sudo apt install --only-upgrade adguard-tray
            ```
          files: |
            dist/adguard-tray_*_all.deb
          generate_release_notes: false
